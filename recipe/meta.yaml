{% set name = "mmcif_pdbx" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 456b2f548d18306b82db6578cdc4f18c45be16960950db8ca7064d3ee66ebfc8

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - pdbx
  requires:
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/Electrostatics/mmcif_pdbx
  license: CC0
  license_family: PUBLIC-DOMAIN
  license_file: LICENSE
  summary: Python utilities for PDBx/mmCIF storage model
  doc_url: http://mmcif.wwpdb.org/pdbx-mmcif-home-page.html
  dev_url: https://github.com/Electrostatics/mmcif_pdbx

extra:
  recipe-maintainers:
    - sobolevnrm
    - tsenapathi
